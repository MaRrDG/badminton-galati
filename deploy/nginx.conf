# Static site config for the test deployment (mounted as /etc/nginx/conf.d/default.conf).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Behind a reverse proxy: redirects (e.g. /sportivi -> /sportivi/) stay relative,
    # so they keep the public host and scheme instead of this container's port 80.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # A test deployment: keep it out of search engines. add_header in a location replaces the
    # server-level ones, so every location repeats this header.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Astro's hashed build assets (JS, CSS, fonts): the name changes with the content.
    location /_astro/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # HTML and unhashed files (photos, logo): short cache, so a deploy shows up within minutes.
    location / {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        try_files $uri $uri/ =404;
    }
}
